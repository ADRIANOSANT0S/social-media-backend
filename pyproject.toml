[tool.poetry]
name = "social-media-backend"
version = "0.1.0"
description = "A Django-based backend for a full-featured social media app, usin PostigreSQL, JWT authentication, and RESTfull APIs."
authors = ["Adriano"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.4"
djangorestframework = "^3.16.0"
djangorestframework-simplejwt = {extras = ["blacklist", "crypto"], version = "^5.5.0"}
django-cors-headers = "^4.7.0"
django-environ = "^0.12.0"


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"
mypy = "^1.17.0"
pre-commit = "^4.2.0"
pytest = "^8.4.1"
factory-boy = "^3.3.3"
pytest-django = "^4.11.1"
django-extensions = "^4.1"
drf-spectacular = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.py$'
exclude = '''
/(    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | poetry.lock 
    | __pycache__/
)/
'''

[tool.isort]
profile = "black"
line_length = 88
include_trailing_comma = true